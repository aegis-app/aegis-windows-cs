name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # 🪟 WinForms アプリのため Windows ランナーでビルド・テスト・publish まで確認する
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run logic-layer tests
        run: dotnet run --project src/AegisTest/AegisTest.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/AegisWin/AegisWin.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-exe
          path: out/AEGIS.exe
